<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="45" ry="35" fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="35" fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>

  <!-- Cat Ears -->
  <polygon points="75,45 85,25 95,45" fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>
  <polygon points="105,45 115,25 125,45" fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>

  <!-- Inner Ears -->
  <polygon points="78,42 85,30 92,42" fill="#ffb380"/>
  <polygon points="108,42 115,30 122,42" fill="#ffb380"/>

  <!-- Cat Eyes -->
  <ellipse cx="90" cy="65" rx="8" ry="12" fill="#2c3e50"/>
  <ellipse cx="110" cy="65" rx="8" ry="12" fill="#2c3e50"/>

  <!-- Eye Highlights -->
  <ellipse cx="92" cy="62" rx="3" ry="4" fill="#ecf0f1"/>
  <ellipse cx="112" cy="62" rx="3" ry="4" fill="#ecf0f1"/>

  <!-- Cat Nose -->
  <polygon points="100,75 95,80 105,80" fill="#e74c3c"/>

  <!-- Cat Mouth -->
  <path d="M 100 82 Q 95 87 90 85" stroke="#2c3e50" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 82 Q 105 87 110 85" stroke="#2c3e50" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cat Whiskers -->
  <line x1="60" y1="70" x2="80" y2="72" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="78" x2="80" y2="78" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="72" x2="140" y2="70" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="78" x2="140" y2="78" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>

  <!-- Cat Paws -->
  <ellipse cx="75" cy="145" rx="12" ry="8" fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>
  <ellipse cx="125" cy="145" rx="12" ry="8" fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>

  <!-- Cat Tail -->
  <path d="M 145 120 Q 160 100 170 85 Q 175 80 180 85 Q 175 90 170 95 Q 160 110 145 130"
        fill="#ff8c42" stroke="#ff6b1a" stroke-width="2"/>

  <!-- Cat Belly -->
  <ellipse cx="100" cy="125" rx="25" ry="20" fill="#ffb380"/>

  <!-- Decorative Stripes -->
  <ellipse cx="100" cy="50" rx="20" ry="3" fill="#ff6b1a" opacity="0.7"/>
  <ellipse cx="100" cy="110" rx="30" ry="3" fill="#ff6b1a" opacity="0.7"/>
  <ellipse cx="100" cy="135" rx="25" ry="3" fill="#ff6b1a" opacity="0.7"/>
</svg>